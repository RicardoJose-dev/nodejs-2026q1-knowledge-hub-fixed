version: '3.9'

services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '7000:7000'
    env_file:
      - .env
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7000/']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: on-failure
    networks:
      - knowledgehub

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER}']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - knowledgehub

  adminer:
    image: adminer
    ports:
      - '8080:8080'
    networks:
      - knowledgehub
    profiles:
      - debug

volumes:
  pgdata:

networks:
  knowledgehub:
    driver: bridge
